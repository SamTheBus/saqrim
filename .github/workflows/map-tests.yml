name: Map browser checks
on:
  push:
    branches: [interactive-map, map-world-layers]
    paths: ['map*', 'world*', 'catalog*', 'site-top.js', 'tests/**', '.github/workflows/map-tests.yml', 'assets/map/**']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: |
          node --check map.js
          node --check map-links.js
          node --check site-top.js
          node --check world-data.js
          node --check world-picker.js
          node --check worlds.js
      - name: Mainland map and preservation regression tests
        run: python tests/map-browser.py
      - name: World switching, filters, geographic evidence and failure cases
        run: python tests/world-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-browser-screenshots
          path: test-results/
          retention-days: 7
