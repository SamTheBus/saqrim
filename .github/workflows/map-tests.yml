name: Map browser checks
on:
  push:
    branches: [interactive-map]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validate JavaScript syntax
        run: |
          node --check map.js
          node --check map-links.js
          node --check site-top.js
      - name: Test actual map, catalog, navigation and saved choices
        run: python tests/map-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-browser-screenshots
          path: test-results/
          retention-days: 7
