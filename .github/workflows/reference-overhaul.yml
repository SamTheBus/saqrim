name: Reference overhaul checks
on:
  push:
    branches: [main]
    paths:
      - 'load-order*'
      - 'catalog-current.html'
      - 'quests-data.json'
      - 'artifact-review.json'
      - 'site-top.js'
      - 'tests/october-sync.py'
      - '.github/workflows/reference-overhaul.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python -m pip install beautifulsoup4==4.13.5 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: python tests/october-sync.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-load-order-checks
          path: test-results/
          retention-days: 7
