name: Reward research content checks
on:
  push:
    branches: [reward-roster-research]
    paths:
      - 'data/reward-research-01.json'
      - 'tools/apply-reward-research-01.py'
      - 'tests/reward-research-01.py'
      - '.github/workflows/reward-research-build.yml'
permissions:
  contents: write
concurrency:
  group: reward-research-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install existing test dependencies
        run: |
          python -m pip install beautifulsoup4==4.13.5 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Apply exact-baseline research patch
        run: python tools/apply-reward-research-01.py
      - name: Check new research and browser behavior
        run: python tests/reward-research-01.py
      - name: Run existing preservation and content regressions
        run: python tests/october-sync.py
      - name: Commit verified site output to review branch only
        run: |
          test "$GITHUB_REF_NAME" = reward-roster-research
          python - <<'PY'
          import json, subprocess
          paths=json.load(open('REWARD-RESEARCH-01-REPORT.json'))['changedPaths']+['REWARD-RESEARCH-01-REPORT.json']
          assert all(not p.startswith('.github/') for p in paths)
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          if ! git diff --cached --quiet; then
            git config user.name 'Saqrim content review'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m 'Expand sourced reward leads and Dagoth quest-trigger research'
            git push origin HEAD:reward-roster-research
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reward-research-reviewed
          path: |
            test-results/
            REWARD-RESEARCH-01-REPORT.json
          retention-days: 7
