name: Prepare world map assets
on:
  push:
    branches: [map-world-layers]
    paths: ['.github/workflows/prepare-world-maps.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==11.3.0
      - name: Prepare maps with source records
        shell: python
        run: |
          import urllib.request, urllib.parse, json, pathlib, io, re, concurrent.futures
          from PIL import Image
          def get(url):
            return urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=15).read()
          def api(**args):
            return json.loads(get('https://en.uesp.net/w/api.php?'+urllib.parse.urlencode({'format':'json',**args})))
          output=pathlib.Path('assets/map/worlds');output.mkdir(parents=True,exist_ok=True)
          titles=['SR-map-Solstheim.jpg','SR-map-Solstheim.png','DB-map-Solstheim.png','DB-map-Solstheim.jpg','SR-map-Soul Cairn.jpg','SR-map-Forgotten Vale.jpg','SR-map-Blackreach.jpg']
          for title in ['Skyrim:Maps','Skyrim:Solstheim','Skyrim:Soul Cairn','Skyrim:Forgotten Vale','Skyrim:Blackreach']:
            try:
              obj=api(action='parse',page=title,prop='wikitext');text=obj.get('parse',{}).get('wikitext',{}).get('*','')
              lines=[line for line in text.splitlines() if re.search('imagemap|map-|rect |circle |poly |Map Link|maplink',line,re.I)]
              print('WIKI_MAP_REFERENCES',title,'\n'.join(lines)[:20000])
              for name in re.findall(r'(?:File|Image):([^|\]\n]+)',text,re.I):
                if 'Solstheim' in name and re.search('map',name,re.I): titles.append(name)
            except Exception as exc: print('WIKI_ERROR',title,str(exc))
          pages=api(action='query',titles='|'.join('File:'+t for t in dict.fromkeys(titles)),prop='imageinfo',iiprop='url|size',iiurlwidth=2400)['query']['pages']
          print('IMAGE_METADATA',json.dumps(pages,ensure_ascii=False))
          def download(page):
            if not page.get('imageinfo'):return None
            info=page['imageinfo'][0];title=page['title']
            key='solstheim' if 'Solstheim' in title else 'soul-cairn' if 'Soul Cairn' in title else 'forgotten-vale' if 'Forgotten Vale' in title else 'blackreach'
            url=info['url'];variants=[url,info.get('thumburl'),url.replace('https://images.uesp.net/','https://en.uesp.net/w/images/')]
            for variant in dict.fromkeys(u for u in variants if u):
              try:
                image=Image.open(io.BytesIO(get(variant))).convert('RGB');size=image.size
                image.thumbnail((3072,3072),Image.Resampling.LANCZOS);image.save(output/(key+'.webp'),quality=88)
                result={'image':str(output/(key+'.webp')),'originalSize':[info['width'],info['height']],'imageSize':image.size,'source':info['descriptionurl'],'imageURL':variant,'credit':'Bethesda game imagery; map reference from UESP.'}
                print('MAP_ASSET',key,json.dumps(result));return (key,result)
              except Exception as exc:print('IMAGE_UNAVAILABLE',variant,str(exc))
            return None
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: assets=dict(r for r in pool.map(download,pages.values()) if r)
          url='https://staticdelivery.nexusmods.com/mods/1704/images/109541/109541-1731800006-736173188.png'
          try:
            image=Image.open(io.BytesIO(get(url))).convert('RGB');size=image.size;image.thumbnail((2000,2000),Image.Resampling.LANCZOS);image.save(output/'icemoth.webp',quality=92)
            assets['icemoth']={'image':str(output/'icemoth.webp'),'originalSize':size,'imageSize':image.size,'source':'https://www.nexusmods.com/skyrimspecialedition/mods/109541?tab=images','imageURL':url,'credit':'Reference map posted by RoastGorilla439; map icons by Klime; Siege at Icemoth.'}
          except Exception as exc:print('ICEMOTH_UNAVAILABLE',str(exc))
          (output/'sources.json').write_text(json.dumps(assets,ensure_ascii=False,indent=2))
          print('AVAILABLE_WORLDS',list(assets))
      - name: Commit prepared assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/map/worlds
          git diff --cached --quiet || (git commit -m 'Add available attributed world map assets' && git push origin HEAD:map-world-layers)
