name: World reference metadata
on:
  push:
    branches: [map-world-layers]
    paths: ['.github/workflows/world-map-references.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public reference pages
        shell: python
        run: |
          import urllib.request,urllib.parse,json,re,concurrent.futures
          def inspect(url):
            try:
              data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20).read().decode('utf8','replace')
              links=re.findall(r'(?:src|href)=[\"\']([^\"\']+)[\"\']',data)
              print('ASSETS',url,json.dumps([s for s in links if any(t in s for t in ['.js','.webp','.png','.jpg','.json'])][:65]))
              if 'api.php' in url:
                obj=json.loads(data)
                if 'parse' in obj:
                  txt=obj['parse'].get('wikitext',{}).get('*','');i=txt.find('Map Markers Setup');print('COORDINATE_SECTION',url,txt[i:i+20000] if i>=0 else txt[:18000])
                else:print('API',url,data[:18000])
              else:
                print('CONFIG',url,'\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',data,re.S))[:10000])
            except Exception as exc:print('ERROR',url,str(exc))
          root='https://en.uesp.net/w/api.php?'
          urls=['https://www.itemaps.com/maps/skyrim/solstheim','https://atlasforge.gg/skyrim/map',root+urllib.parse.urlencode({'format':'json','action':'query','list':'search','srsearch':'Solstheim','srnamespace':6,'srlimit':50}),root+urllib.parse.urlencode({'format':'json','action':'parse','page':'Skyrim:Soul Cairn','prop':'wikitext'})]
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as p:list(p.map(inspect,urls))
