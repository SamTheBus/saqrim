name: Native map calibration
on:
  push:
    branches: [map-world-layers]
    paths: ['.github/workflows/native-map-config.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - shell: python
        run: |
          import urllib.request,json,re,concurrent.futures
          urls=['https://www.itemaps.com/assets/map.js?v=20260916-4','https://www.itemaps.com/media/maps/skyrim/markers.json?v=20260916-4','https://skyrim.atlasforge.gg/_next/static/chunks/pages/map/%5B%5B...map_world%5D%5D-79d6f33203f4310c.js']
          def read(url):
            try:
              text=urllib.request.urlopen(url,timeout=20).read().decode()
              print('START',url)
              if 'markers.json' in url:
                obj=json.loads(text);print('ROOT',str(type(obj)),list(obj)[:25] if isinstance(obj,dict) else len(obj))
                if isinstance(obj,dict):
                  for k,v in obj.items():
                    if k in ['markers','locations','pins']:print('POINTS',k,str(v)[:1600])
                    else: print('META',k,json.dumps(v,ensure_ascii=False)[:18000])
              else:
                terms=['solstheim','Solstheim','imageOverlay','tileLayer','imageUrl','bounds','soul_cairn','soul-cairn','worlds','\.webp','\.jpg']
                shown=set()
                for term in terms:
                  for m in list(re.finditer(term,text))[:5]:
                    a=max(0,m.start()-300);b=min(len(text),m.end()+600)
                    if a not in shown:print('CONFIG',text[a:b]);shown.add(a)
              print('END',url)
            except Exception as e:print('ERROR',url,str(e))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as p:list(p.map(read,urls))
